const RUNTIME_VERSION = "5.1-cloud-ceo-executor";

const MAX_LOGS = 100;
const MAX_MEMORY = 100;
const MAX_STRATEGIES = 50;
const MAX_COUNCIL_CASES = 50;
const CYCLE_LOCK_MS = 10 * 60 * 1000;

const BASE_DEPARTMENTS = [
  "企画",
  "技術",
  "財務",
  "リスク管理"
];

const STORE_KEYS = {
  companyState: "companyState",
  tasks: "tasks",
  business: "business",
  humanGates: "humanGates",
  memory: "companyMemory",
  strategies: "strategyHistory",
  council: "councilCases",
  engineLog: "engineLog",
  lastDecision: "lastDecision"
};

const DEFAULT_COMPANY_STATE = {
  goal: "事業を継続的に改善し、収益化できる機会を見つける",
  mode: "normal",
  running: true,
  waiting: false,
  cycleCount: 0,
  lastCycleAt: null,
  currentFocus: "観測中",
  currentPlan: "",
  nextAction: "会社状態を分析して次の仕事を決定する",
  activeDepartments: BASE_DEPARTMENTS,
  runtimeVersion: RUNTIME_VERSION
};

function nowISO() {
  return new Date().toISOString();
}

function makeId(prefix) {
  return (
    prefix +
    "_" +
    Date.now() +
    "_" +
    Math.random().toString(36).slice(2, 8)
  );
}

function clone(value) {
  return JSON.parse(JSON.stringify(value));
}

function json(data, status = 200, extraHeaders = {}) {
  return new Response(
    JSON.stringify(data, null, 2),
    {
      status,
      headers: {
        "Content-Type": "application/json; charset=utf-8",
        "Cache-Control": "no-store",
        ...extraHeaders
      }
    }
  );
}

async function getStore(env, key, fallback) {
  const row = await env.DB
    .prepare(`
      SELECT value_json
      FROM company_store
      WHERE key = ?
    `)
    .bind(key)
    .first();

  if (!row) {
    return clone(fallback);
  }

  try {
    return JSON.parse(row.value_json);
  } catch (error) {
    console.error("D1 JSON parse error:", key, error);
    return clone(fallback);
  }
}

async function setStore(env, key, value) {
  const now = nowISO();

  await env.DB
    .prepare(`
      INSERT INTO company_store (
        key,
        value_json,
        updated_at
      )
      VALUES (?, ?, ?)
      ON CONFLICT(key)
      DO UPDATE SET
        value_json = excluded.value_json,
        updated_at = excluded.updated_at
    `)
    .bind(
      key,
      JSON.stringify(value),
      now
    )
    .run();
}

async function addLog(env, source, message) {
  const logs = await getStore(
    env,
    STORE_KEYS.engineLog,
    []
  );

  logs.unshift({
    id: makeId("log"),
    source,
    message,
    createdAt: nowISO()
  });

  await setStore(
    env,
    STORE_KEYS.engineLog,
    logs.slice(0, MAX_LOGS)
  );
}

async function addMemory(env, memoryItem) {
  const memory = await getStore(
    env,
    STORE_KEYS.memory,
    []
  );

  memory.unshift(memoryItem);

  await setStore(
    env,
    STORE_KEYS.memory,
    memory.slice(0, MAX_MEMORY)
  );
}

function normalizeBusiness(value) {
  return {
    id: value.id || makeId("business"),
    name: String(value.name || "").trim(),
    customer: String(value.customer || "").trim(),
    problem: String(value.problem || "").trim(),
    status: value.status || "discovered",
    stage: value.stage || "discovered",
    pipeline: value.pipeline || "research",
    discoveredAt: value.discoveredAt || nowISO(),

    researchTaskId:
      value.researchTaskId || null,

    productTaskId:
      value.productTaskId || null,

    salesTaskId:
      value.salesTaskId || null,

    salesEvaluationTaskId:
      value.salesEvaluationTaskId || null,

    humanGateTaskId:
      value.humanGateTaskId || null
  };
}

function findBusiness(businesses, businessId) {
  return businesses.find(
    (item) => item.id === businessId
  ) || null;
}

function findPipelineBusiness(businesses) {
  const activeStages = new Set([
    "discovered",
    "research",
    "product",
    "sales_preparation",
    "sales_evaluation",
    "human_approval"
  ]);

  return businesses.find(
    (business) =>
      activeStages.has(business.stage)
  ) || null;
}

function chooseActiveDepartments(strategyTitle) {
  const departments = new Set(
    BASE_DEPARTMENTS
  );

  if (
    /市場|顧客|商品|事業/.test(
      strategyTitle
    )
  ) {
    departments.add("企画");
  }

  if (
    /商品|実装|技術|開発|コード/.test(
      strategyTitle
    )
  ) {
    departments.add("技術");
  }

  if (
    /販売|収益|価格|利益/.test(
      strategyTitle
    )
  ) {
    departments.add("財務");
  }

  if (
    /公開|契約|リスク|承認|外部/.test(
      strategyTitle
    )
  ) {
    departments.add("リスク管理");
  }

  return [...departments];
}

function makeCouncil(strategy) {
  const departments =
    chooseActiveDepartments(
      strategy.title
    );

  const reviewMap = {
    "企画": {
      summary:
        "顧客価値・事業性・方向性を確認します。",
      recommendation:
        "小さく検証して反応を確認します。"
    },

    "技術": {
      summary:
        "実装可能性・技術課題を確認します。",
      recommendation:
        "最小構成から始めます。"
    },

    "財務": {
      summary:
        "収益性・コスト・継続性を確認します。",
      recommendation:
        "低コストで検証します。"
    },

    "リスク管理": {
      summary:
        "安全・法務・規約・運営リスクを確認します。",
      recommendation:
        "不可逆な操作を避けます。"
    }
  };

  return {
    id: makeId("council"),
    strategyId: strategy.id,
    title: strategy.title,
    departments,

    reviews: departments.map(
      (department) => ({
        department,

        ...(reviewMap[department] || {
          summary:
            "必要な能力を確認します。",
          recommendation:
            "小さく検証します。"
        }),

        source: "内部ルール",
        createdAt: nowISO()
      })
    ),

    createdAt: nowISO()
  };
}

function makeDecision(strategy, council) {
  let action =
    "安全条件を守って小規模実行";

  if (
    strategy.objective ===
    "Human Gate"
  ) {
    action = "人間承認を待つ";
  }

  if (
    strategy.objective ===
    "Execution"
  ) {
    action =
      "既存タスクをCloud Executorで実行する";
  }

  if (
    strategy.objective ===
    "Discovery"
  ) {
    action =
      "新しい事業候補を探索";
  }

  if (
    strategy.objective ===
    "Business Pipeline"
  ) {
    action =
      "発見済み事業候補を段階的に検証";
  }

  return {
    id: makeId("decision"),
    action,
    strategyTitle: strategy.title,
    reason: strategy.reason,
    departments: council.departments,
    createdAt: nowISO()
  };
}

function makeStrategy({
  pending,
  waitingHuman,
  businesses,
  nextBusiness
}) {
  if (waitingHuman > 0) {
    return {
      id: makeId("strategy"),
      title: "Human Gate管理",
      reason:
        "人間承認が必要な処理を先に停止・確認する。",
      objective: "Human Gate"
    };
  }

  if (pending > 0) {
    return {
      id: makeId("strategy"),
      title: "既存タスクを実行",
      reason:
        "登録済みのタスクを処理し、結果を次の判断へ戻す。",
      objective: "Execution"
    };
  }

  if (businesses.length === 0) {
    return {
      id: makeId("strategy"),
      title: "新しい事業候補を探索",
      reason:
        "会社の現在目標に対して新しい収益機会を発見する。",
      objective: "Discovery"
    };
  }

  if (nextBusiness) {
    return {
      id: makeId("strategy"),
      title:
        `事業候補「${nextBusiness.name}」を検証`,
      reason:
        "発見済みの候補について市場調査から段階的に検証する。",
      objective: "Business Pipeline"
    };
  }

  return {
    id: makeId("strategy"),
    title: "既存事業候補の改善",
    reason:
      "これまでの結果を確認し、次の改善候補を選ぶ。",
    objective: "Improvement"
  };
}async function discoverBusiness(env) {
  const businesses = await getStore(
    env,
    STORE_KEYS.business,
    []
  );

  const existing = businesses.find(
    (item) =>
      item.name ===
        "小規模事業向け調査レポート生成サービス" &&
      item.status !== "rejected"
  );

  if (existing) {
    return existing;
  }

  const business =
    normalizeBusiness({
      id: makeId("business"),

      name:
        "小規模事業向け調査レポート生成サービス",

      customer:
        "小規模事業者",

      problem:
        "市場調査や競合調査に時間がかかる",

      status: "discovered",
      stage: "discovered",
      pipeline: "research",
      discoveredAt: nowISO()
    });

  businesses.unshift(business);

  await setStore(
    env,
    STORE_KEYS.business,
    businesses
  );

  await addLog(
    env,
    "Business Discovery",
    `事業候補を発見しました：「${business.name}」`
  );

  return business;
}

async function createTask(
  env,
  {
    title,
    level,
    stage,
    businessId,
    source = "CEO Strategy",
    priority = "normal"
  }
) {
  const tasks = await getStore(
    env,
    STORE_KEYS.tasks,
    []
  );

  const existing = tasks.find(
    (task) =>
      task.title === title &&
      (
        task.status === "pending" ||
        task.status === "completed" ||
        task.status === "waiting_human"
      )
  );

  if (
    existing &&
    (
      level === "research" ||
      level === "product" ||
      level === "sales" ||
      level === "sales_evaluation" ||
      level === "human_gate"
    )
  ) {
    return existing;
  }

  const task = {
    id: makeId("task"),
    title,
    priority,
    status:
      level === "human_gate"
        ? "waiting_human"
        : "pending",

    runCount: 0,
    lastRunAt: null,
    result: null,

    executor:
      level === "human_gate"
        ? "Human Gate"
        : "Cloud Executor",

    source,
    createdAt: nowISO(),
    updatedAt: nowISO(),
    evaluation: null,

    level,
    retryCount: 0,

    requiresHuman:
      level === "human_gate",

    humanGateId: null,
    localExecution: null,

    pipeline: {
      type: "business_pipeline",
      stage,
      businessId
    }
  };

  tasks.unshift(task);

  await setStore(
    env,
    STORE_KEYS.tasks,
    tasks
  );

  await addLog(
    env,
    "Task Core",
    `タスクを登録しました：「${title}」`
  );

  return task;
}

async function createResearchTask(
  env,
  business
) {
  if (business.researchTaskId) {
    return business.researchTaskId;
  }

  const task = await createTask(
    env,
    {
      title:
        `市場調査:${business.name}`,

      level: "research",
      stage: "research",

      businessId: business.id,

      source:
        "Business Discovery"
    }
  );

  const businesses = await getStore(
    env,
    STORE_KEYS.business,
    []
  );

  const index = businesses.findIndex(
    (item) =>
      item.id === business.id
  );

  if (index >= 0) {
    businesses[index] =
      normalizeBusiness({
        ...businesses[index],

        status:
          "researching",

        stage:
          "research",

        pipeline:
          "research",

        researchTaskId:
          task.id
      });

    await setStore(
      env,
      STORE_KEYS.business,
      businesses
    );
  }

  await addLog(
    env,
    "CEO",
    `市場調査タスクを生成しました：「${business.name}」`
  );

  return task.id;
}

