async function advancePipeline(
  env,
  task
) {
  if (!task.pipeline) {
    return null;
  }

  const businessId =
    task.pipeline.businessId;

  if (!businessId) {
    return null;
  }

  const businesses = await getStore(
    env,
    STORE_KEYS.business,
    []
  );

  const businessIndex =
    businesses.findIndex(
      (item) =>
        item.id === businessId
    );

  if (businessIndex < 0) {
    return null;
  }

  const business =
    normalizeBusiness(
      businesses[businessIndex]
    );

  if (task.level === "research") {
    business.status =
      "building";

    business.stage =
      "product";

    business.pipeline =
      "product";

    const nextTask =
      await createTask(
        env,
        {
          title:
            `商品作成:${business.name}`,

          level:
            "product",

          stage:
            "product",

          businessId:
            business.id
        }
      );

    business.productTaskId =
      nextTask.id;

    businesses[businessIndex] =
      business;

    await setStore(
      env,
      STORE_KEYS.business,
      businesses
    );

    await addLog(
      env,
      "Pipeline",
      `市場調査完了 → 商品作成へ：「${business.name}」`
    );

    return nextTask;
  }

  if (task.level === "product") {
    business.status =
      "sales_preparation";

    business.stage =
      "sales_preparation";

    business.pipeline =
      "sales";

    const nextTask =
      await createTask(
        env,
        {
          title:
            `販売準備:${business.name}`,

          level:
            "sales",

          stage:
            "sales",

          businessId:
            business.id
        }
      );

    business.salesTaskId =
      nextTask.id;

    businesses[businessIndex] =
      business;

    await setStore(
      env,
      STORE_KEYS.business,
      businesses
    );

    await addLog(
      env,
      "Pipeline",
      `商品作成完了 → 販売準備へ：「${business.name}」`
    );

    return nextTask;
  }

  if (task.level === "sales") {
    business.status =
      "evaluating";

    business.stage =
      "sales_evaluation";

    business.pipeline =
      "sales_evaluation";

    const nextTask =
      await createTask(
        env,
        {
          title:
            `販売評価:${business.name}`,

          level:
            "sales_evaluation",

          stage:
            "sales_evaluation",

          businessId:
            business.id
        }
      );

    business.salesEvaluationTaskId =
      nextTask.id;

    businesses[businessIndex] =
      business;

    await setStore(
      env,
      STORE_KEYS.business,
      businesses
    );

    await addLog(
      env,
      "Pipeline",
      `販売準備完了 → 販売評価へ：「${business.name}」`
    );

    return nextTask;
  }

  if (
    task.level ===
    "sales_evaluation"
  ) {
    business.status =
      "human_approval";

    business.stage =
      "human_approval";

    business.pipeline =
      "human_gate";

    const nextTask =
      await createTask(
        env,
        {
          title:
            `公開承認:${business.name}`,

          level:
            "human_gate",

          stage:
            "human_gate",

          businessId:
            business.id,

          priority:
            "high"
        }
      );

    business.humanGateTaskId =
      nextTask.id;

    const humanGates =
      await getStore(
        env,
        STORE_KEYS.humanGates,
        []
      );

    const gate = {
      id:
        makeId("gate"),

      taskId:
        nextTask.id,

      taskTitle:
        nextTask.title,

      status:
        "pending",

      reason:
        "外部公開・契約・支払いなど、人間の承認が必要な操作です。",

      createdAt:
        nowISO(),

      resolvedAt:
        null
    };

    humanGates.unshift(gate);

    nextTask.humanGateId =
      gate.id;

    await setStore(
      env,
      STORE_KEYS.humanGates,
      humanGates
    );

    const tasks =
      await getStore(
        env,
        STORE_KEYS.tasks,
        []
      );

    const taskIndex =
      tasks.findIndex(
        (item) =>
          item.id === nextTask.id
      );

    if (taskIndex >= 0) {
      tasks[taskIndex] =
        nextTask;

      await setStore(
        env,
        STORE_KEYS.tasks,
        tasks
      );
    }

    businesses[businessIndex] =
      business;

    await setStore(
      env,
      STORE_KEYS.business,
      businesses
    );

    await addLog(
      env,
      "Human Gate",
      `人間承認が必要なタスクを停止しました：「${nextTask.title}」`
    );

    return nextTask;
  }

  return null;
}

async function executePendingTask(
  env,
  task
) {
  const businesses =
    await getStore(
      env,
      STORE_KEYS.business,
      []
    );

  const business =
    task.pipeline &&
    task.pipeline.businessId
      ? findBusiness(
          businesses,
          task.pipeline.businessId
        )
      : null;

  let artifact;

  if (
    task.level === "research" &&
    business
  ) {
    artifact =
      buildResearchArtifact(
        task,
        business
      );
  } else if (
    task.level === "product" &&
    business
  ) {
    artifact =
      buildProductArtifact(
        task,
        business
      );
  } else if (
    task.level === "sales" &&
    business
  ) {
    artifact =
      buildSalesArtifact(
        task,
        business
      );
  } else if (
    task.level === "sales_evaluation" &&
    business
  ) {
    artifact =
      buildSalesEvaluationArtifact(
        task,
        business
      );
  } else {
    artifact =
      buildGenericArtifact(task);
  }

  await saveArtifact(
    env,
    artifact
  );

  task.status =
    "completed";

  task.runCount =
    Number(task.runCount || 0) + 1;

  task.lastRunAt =
    nowISO();

  task.updatedAt =
    nowISO();

  task.executor =
    "Cloud Executor";

  task.result =
    `${artifact.type} をクラウド上で生成しました。`;

  task.localExecution = {
    action:
      artifact.type,

    output_path:
      `cloud://artifact/${task.id}`,

    cloud:
      true,

    generatedAt:
      artifact.generatedAt
  };

  task.evaluation =
    makeTaskEvaluation(
      task,
      artifact
    );

  const tasks =
    await getStore(
      env,
      STORE_KEYS.tasks,
      []
    );

  const taskIndex =
    tasks.findIndex(
      (item) =>
        item.id === task.id
    );

  if (taskIndex >= 0) {
    tasks[taskIndex] =
      task;

    await setStore(
      env,
      STORE_KEYS.tasks,
      tasks
    );
  }

  await addMemory(
    env,
    {
      id:
        makeId("memory"),

      taskId:
        task.id,

      title:
        task.title,

      evaluation:
        task.evaluation.level,

      lesson:
        task.evaluation.lesson,

      nextAction:
        task.evaluation.nextAction,

      createdAt:
        nowISO()
    }
  );

  await addLog(
    env,
    "Cloud Executor",
    `タスクを実行しました：「${task.title}」`
  );

  const nextTask =
    await advancePipeline(
      env,
      task
    );

  return {
    task,
    artifact,
    nextTask
  };
}async function executeCloudCycle(
  env,
  source = "manual"
) {
  const lockKey =
    "cycleLock";

  const currentLock =
    await getStore(
      env,
      lockKey,
      null
    );

  if (
    currentLock &&
    Number(
      currentLock.lockedAtMs || 0
    ) >
      Date.now() -
        CYCLE_LOCK_MS
  ) {
    return {
      ok: true,
      status: "busy",
      source,
      message:
        "別のCompany Cycleが実行中です。"
    };
  }

  await setStore(
    env,
    lockKey,
    {
      lockedAtMs:
        Date.now(),

      source
    }
  );

  const startedAt =
    nowISO();

  try {
    await addLog(
      env,
      "Company Engine",
      `サイクルを開始しました。source=${source}`
    );

    const companyState =
      await getStore(
        env,
        STORE_KEYS.companyState,
        clone(
          DEFAULT_COMPANY_STATE
        )
      );

    const tasks =
      await getStore(
        env,
        STORE_KEYS.tasks,
        []
      );

    const businesses =
      await getStore(
        env,
        STORE_KEYS.business,
        []
      );

    const humanGates =
      await getStore(
        env,
        STORE_KEYS.humanGates,
        []
      );

    const strategies =
      await getStore(
        env,
        STORE_KEYS.strategies,
        []
      );

    const councilCases =
      await getStore(
        env,
        STORE_KEYS.council,
        []
      );

    companyState.runtimeVersion =
      RUNTIME_VERSION;

    companyState.cycleCount =
      Number(
        companyState.cycleCount || 0
      ) + 1;

    companyState.lastCycleAt =
      startedAt;

    companyState.waiting =
      false;

    await env.DB
      .prepare(`
        UPDATE runtime_meta
        SET
          cycle_count = ?,
          runtime_version = ?
        WHERE id = 1
      `)
      .bind(
        companyState.cycleCount,
        RUNTIME_VERSION
      )
      .run();

    const pendingGate =
      humanGates.find(
        (gate) =>
          gate.status ===
          "pending"
      );

    if (pendingGate) {
      companyState.waiting =
        true;

      companyState.currentFocus =
        "人間承認待ち";

      companyState.nextAction =
        "Human Gateの承認を待つ";

      await setStore(
        env,
        STORE_KEYS.companyState,
        companyState
      );

      await addLog(
        env,
        "待機",
        `人間承認が必要なため停止しました：「${pendingGate.taskTitle}」`
      );

      return {
        ok: true,
        status:
          "waiting_human",

        cycleCount:
          companyState.cycleCount,

        pendingGate:
          pendingGate.taskTitle
      };
    }

    const pendingTask =
      tasks.find(
        (task) =>
          task.status ===
          "pending"
      );

    if (pendingTask) {
      companyState.currentFocus =
        "Cloud Executorでタスクを実行中";

      companyState.currentPlan =
        pendingTask.title;

      companyState.nextAction =
        "実行結果を評価して次の工程へ進む";

      await setStore(
        env,
        STORE_KEYS.companyState,
        companyState
      );

      const execution =
        await executePendingTask(
          env,
          pendingTask
        );

      return {
        ok: true,

        status:
          "task_executed",

        cycleCount:
          companyState.cycleCount,

        task:
          execution.task,

        artifact:
          execution.artifact,

        nextTask:
          execution.nextTask
            ? execution.nextTask.id
            : null
      };
    }

    const nextBusiness =
      findPipelineBusiness(
        businesses
      );

    const strategy =
      makeStrategy({
        pending: 0,

        waitingHuman: 0,

        businesses,

        nextBusiness
      });

    strategies.unshift(
      strategy
    );

    await setStore(
      env,
      STORE_KEYS.strategies,
      strategies.slice(
        0,
        MAX_STRATEGIES
      )
    );

    await addLog(
      env,
      "CEO",
      `戦略決定：「${strategy.title}」`
    );

    if (
      strategy.objective ===
      "Discovery"
    ) {
      const business =
        await discoverBusiness(
          env
        );

      const council =
        makeCouncil(
          strategy
        );

      councilCases.unshift(
        council
      );

      await setStore(
        env,
        STORE_KEYS.council,
        councilCases.slice(
          0,
          MAX_COUNCIL_CASES
        )
      );

      const decision =
        makeDecision(
          strategy,
          council
        );

      await setStore(
        env,
        STORE_KEYS.lastDecision,
        decision
      );

      companyState.currentFocus =
        "事業機会を探索中";

      companyState.currentPlan =
        `「${business.name}」を検証`;

      companyState.nextAction =
        "市場調査タスクを生成する";

      companyState.activeDepartments =
        council.departments;

      await setStore(
        env,
        STORE_KEYS.companyState,
        companyState
      );

      await addLog(
        env,
        "CEO Council",
        `協議部署：${council.departments.join("・")}`
      );

      await addLog(
        env,
        "CEO",
        `意思決定：「${decision.action}」`
      );

      return {
        ok: true,
        status:
          "discovered",

        cycleCount:
          companyState.cycleCount,

        strategy,
        decision,

        business,
        council
      };
    }

    const council =
      makeCouncil(
        strategy
      );

    councilCases.unshift(
      council
    );

    await setStore(
      env,
      STORE_KEYS.council,
      councilCases.slice(
        0,
        MAX_COUNCIL_CASES
      )
    );

    const decision =
      makeDecision(
        strategy,
        council
      );

    await setStore(
      env,
      STORE_KEYS.lastDecision,
      decision
    );

    companyState.activeDepartments =
      council.departments;

    await addLog(
      env,
      "CEO Council",
      `協議部署：${council.departments.join("・")}`
    );

    await addLog(
      env,
      "CEO",
      `意思決定：「${decision.action}」`
    );

    if (
      strategy.objective ===
      "Business Pipeline"
    ) {
      const business =
        nextBusiness;

      if (
        business &&
        business.stage ===
          "discovered" &&
        !business.researchTaskId
      ) {
        const taskId =
          await createResearchTask(
            env,
            business
          );

        const updatedBusinesses =
          await getStore(
            env,
            STORE_KEYS.business,
            []
          );

        const updatedBusiness =
          findBusiness(
            updatedBusinesses,
            business.id
          );

        companyState.currentFocus =
          "市場調査";

        companyState.currentPlan =
          `「${business.name}」の市場調査`;

        companyState.nextAction =
          "Cloud Executorで市場調査を実行する";

        await setStore(
          env,
          STORE_KEYS.companyState,
          companyState
        );

        return {
          ok: true,
          status:
            "task_created",

          cycleCount:
            companyState.cycleCount,

          strategy,
          decision,
          council,

          taskId,

          business:
            updatedBusiness
        };
      }
    }

    companyState.currentFocus =
      "観測中";

    companyState.nextAction =
      "会社状態を再評価する";

    await setStore(
      env,
      STORE_KEYS.companyState,
      companyState
    );

    return {
      ok: true,

      status:
        "completed",

      cycleCount:
        companyState.cycleCount,

      strategy,
      decision,
      council
    };
  } catch (error) {
    console.error(
      "Company Cycle error:",
      error
    );

    const companyState =
      await getStore(
        env,
        STORE_KEYS.companyState,
        clone(
          DEFAULT_COMPANY_STATE
        )
      );

    companyState.currentFocus =
      "エラー確認中";

    companyState.nextAction =
      "エラー内容を確認して再実行する";

    await setStore(
      env,
      STORE_KEYS.companyState,
      companyState
    );

    await addLog(
      env,
      "Company Engine",
      `サイクル中にエラーが発生しました：${error.message}`
    );

    return {
      ok: false,
      status: "error",
      error:
        String(
          error.message ||
          error
        )
    };
  } finally {
    await setStore(
      env,
      lockKey,
      null
    );

    await addLog(
      env,
      "Company Engine",
      "サイクルを終了しました。"
    );
  }
}

async function heartbeat(env) {
  const now =
    nowISO();

  await env.DB
    .prepare(`
      UPDATE runtime_meta
      SET
        last_heartbeat_at = ?,
        runtime_version = ?
      WHERE id = 1
    `)
    .bind(
      now,
      RUNTIME_VERSION
    )
    .run();

  return {
    ok: true,
    heartbeat: true,
    time: now
  };
}

async function health(env) {
  const runtimeMeta =
    await env.DB
      .prepare(`
        SELECT
          last_heartbeat_at,
          cycle_count,
          runtime_version
        FROM runtime_meta
        WHERE id = 1
      `)
      .first();

  const companyState =
    await getStore(
      env,
      STORE_KEYS.companyState,
      clone(
        DEFAULT_COMPANY_STATE
      )
    );

  const tasks =
    await getStore(
      env,
      STORE_KEYS.tasks,
      []
    );

  const businesses =
    await getStore(
      env,
      STORE_KEYS.business,
      []
    );

  const humanGates =
    await getStore(
      env,
      STORE_KEYS.humanGates,
      []
    );

  return {
    ok: true,

    service:
      "AI Company Core Cloud Runtime",

    runtime:
      RUNTIME_VERSION,

    database:
      true,

    runtime_meta:
      runtimeMeta,

    company: {
      cycleCount:
        companyState.cycleCount,

      currentFocus:
        companyState.currentFocus,

      nextAction:
        companyState.nextAction,

      pendingTasks:
        tasks.filter(
          (task) =>
            task.status ===
            "pending"
        ).length,

      completedTasks:
        tasks.filter(
          (task) =>
            task.status ===
            "completed"
        ).length,

      businessCount:
        businesses.length,

      pendingHumanGates:
        humanGates.filter(
          (gate) =>
            gate.status ===
            "pending"
        ).length
    },

    capabilities: [
      "cloud_ceo_cycle",
      "cloud_executor",
      "d1_persistent_state",
      "business_discovery",
      "research_generation",
      "product_generation",
      "sales_package_generation",
      "sales_evaluation",
      "human_gate",
      "cloud_heartbeat"
    ],

    execution_available:
      true,

    external_actions:
      false,

    external_ai:
      false,

    time:
      nowISO()
  };
}

async function handleStateRead(
  request,
  env
) {
  const url =
    new URL(
      request.url
    );

  const key =
    url.searchParams.get(
      "key"
    );

  if (!key) {
    return json(
      {
        ok: false,
        error:
          "key is required"
      },
      400
    );
  }

  const allowedKeys =
    new Set(
      Object.values(
        STORE_KEYS
      )
    );

  if (
    !allowedKeys.has(key) &&
    !key.startsWith(
      "artifact:"
    )
  ) {
    return json(
      {
        ok: false,
        error:
          "key is not readable"
      },
      403
    );
  }

  const data =
    await getStore(
      env,
      key,
      null
    );

  return json({
    ok: true,
    key,
    data,
    time:
      nowISO()
  });
}

export default {
  async fetch(
    request,
    env
  ) {
    const url =
      new URL(
        request.url
      );

    try {
      if (
        url.pathname ===
        "/api/health"
      ) {
        return json(
          await health(env)
        );
      }

      if (
        url.pathname ===
        "/api/heartbeat"
      ) {
        return json(
          await heartbeat(env)
        );
      }

      if (
        url.pathname ===
        "/api/cycle"
      ) {
        if (
          request.method !== "GET" &&
          request.method !== "POST"
        ) {
          return json(
            {
              ok: false,
              error:
                "method_not_allowed"
            },
            405
          );
        }

        return json(
          await executeCloudCycle(
            env,
            "manual"
          )
        );
      }

      if (
        url.pathname ===
        "/api/state"
      ) {
        return handleStateRead(
          request,
          env
        );
      }

      return env.ASSETS.fetch(
        request
      );
    } catch (error) {
      console.error(
        "Worker request error:",
        error
      );

      return json(
        {
          ok: false,
          error:
            String(
              error.message ||
              error
            )
        },
        500
      );
    }
  },

  async scheduled(
    controller,
    env,
    ctx
  ) {
    ctx.waitUntil(
      executeCloudCycle(
        env,
        "cron"
      )
        .then(
          () => heartbeat(env)
        )
        .catch(
          (error) => {
            console.error(
              "Scheduled cycle error:",
              error
            );
          }
        )
    );
  }
};
