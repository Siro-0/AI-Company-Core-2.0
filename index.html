<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Company Core 2.0</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="container">

    <h1>AI Company Core 2.0</h1>
    <p class="subtitle">システム動作確認</p>

    <!-- 動作テスト -->
    <section class="panel">
      <p id="status" class="status">待機中</p>

      <label for="userInput">動作テスト入力</label>

      <input
        id="userInput"
        type="text"
        placeholder="文字を入力してください"
      >

      <button id="runButton" type="button">
        動作テスト
      </button>

      <div class="result-area">
        <h2>実行結果</h2>
        <p id="result">まだ実行されていません。</p>
      </div>
    </section>

    <!-- タスク管理 -->
    <section class="panel task-panel">
      <h2>タスク管理</h2>

      <label for="taskInput">新しいタスク</label>

      <input
        id="taskInput"
        type="text"
        placeholder="例：商品案を3つ考える"
      >

      <button id="addTaskButton" type="button">
        タスクを登録
      </button>

      <div class="result-area">
        <h2>登録済みタスク</h2>

        <p id="taskCount">登録数：0件</p>

        <ul id="taskList"></ul>
      </div>
    </section>

    <!-- Founder Room -->
    <section class="panel founder-panel">
      <h2>Founder Room</h2>

      <p>
        会社への提案・質問・相談を入力してください。
      </p>

      <label for="founderInput">
        会社への相談
      </label>

      <textarea
        id="founderInput"
        rows="5"
        placeholder="例：新しい事業としてゲームを作るのは面白くない？"
      ></textarea>

      <button
        id="founderSubmitButton"
        type="button"
      >
        会社に相談する
      </button>

      <div class="result-area">
        <h2>協議記録</h2>

        <ul id="founderLog"></ul>
      </div>
    </section>

    <footer>
      <p>AI Company Core 2.0 | Prototype</p>
    </footer>

  </main>
</body>
</html>
