
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Company Core 2.0</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>AI Company Core 2.0</h1>
    <p class="subtitle">システム動作確認</p>

    <section class="panel">
      <p id="status" class="status">待機中</p>

      <label for="userInput">テスト入力</label>
      <input
        id="userInput"
        type="text"
        placeholder="文字を入力してください"
      >

      <button id="runButton" type="button">
        動作テスト
      </button>

      <div class="result-area">
        <h2>実行結果</h2>
        <p id="result">まだ実行されていません。</p>
      </div>
    </section>

    <footer>
      <p>AI Company Core 2.0 | Prototype</p>
    </footer>
  </main>
</body>
</html>
